CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Enable Pointing Device (Mouse)
CONFIG_ZMK_POINTING=y

# Enable Analog Inputs
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_ANALOG_INPUT=y

# Fix for some nRF52840 issues with ADC
CONFIG_ADC_ASYNC=y

# Increase log level for debugging analog input
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Set subsystem log levels to debug
CONFIG_ADC_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y

# Enable specific raw and report debug logs for analog input
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y

# Increase overall log buffer
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_ZMK_MOUSE=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
