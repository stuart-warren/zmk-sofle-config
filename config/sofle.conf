# Enable USB support for HID
CONFIG_ZMK_USB=y

# Enable the USB device stack
CONFIG_USB_DEVICE_STACK=y

# Disable automatic USB init at boot so ZMK can manage it properly
# This helps resolve "No endpoint transports are ready" issues (USB state 11)
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Enable Pointing Device (Mouse) support
CONFIG_ZMK_POINTING=y

# Enable smooth scrolling support
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Enable Analog-to-Digital Converter (ADC) for sensors/battery
CONFIG_ADC=y

# Enable the sensor subsystem
CONFIG_SENSOR=y

# Enable the analog input driver (e.g., for joysticks)
CONFIG_ANALOG_INPUT=y

# Enable asynchronous ADC operations for better performance
CONFIG_ADC_ASYNC=y

# Legacy mouse support flag
CONFIG_ZMK_MOUSE=y

# Set the size of the heap memory pool for dynamic allocations
CONFIG_HEAP_MEM_POOL_SIZE=2048

# --- ZMK Logging ---
# Enable logging over USB CDC ACM (Virtual COM Port)
# CONFIG_ZMK_USB_LOGGING=y

# Enable CDC ACM class for the USB stack
# CONFIG_USB_CDC_ACM=y

# Enable serial and console drivers
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y

# Enable the logging subsystem
# CONFIG_LOG=y

# Set ZMK and subsystem log levels to Debug
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_ADC_LOG_LEVEL_DBG=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y
# CONFIG_SENSOR_LOG_LEVEL_DBG=y
# CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y

# Enable detailed debug logs for analog input values
# CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
# CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y

# Increase the overall log buffer size (8KB)
# CONFIG_LOG_BUFFER_SIZE=8192
